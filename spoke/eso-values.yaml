# Values for ESO. Everything is at the chart default for now (comments only = an empty override, no change in behaviour).
# To change something, uncomment the line. All the defaults (about 970 lines) are shown by
# `helm show values external-secrets/external-secrets`.
# REF: https://artifacthub.io/packages/helm/external-secrets-operator/external-secrets
#
# ---- A selection of defaults worth knowing ----
#
# installCRDs: true    # The CRDs ship with the chart and are part of the release. No keep policy is set, so
#                      # helm uninstall removes the CRDs too, which cascades into deleting every ExternalSecret /
#                      # SecretStore and GC of the generated Secrets (with creationPolicy: Owner). Be careful
#
# serviceAccount:
#   annotations: {}    # Entry point for cloud IAM integration (on GKE, set iam.gke.io/gcp-service-account to bind
#                      # the controller's KSA to a GSA for secretless auth)
#
# scopedNamespace: ""                # Watch scope. The default is all namespaces
# processClusterStore: true          # Whether to process ClusterSecretStore (narrow it when splitting tenants)
# processClusterExternalSecret: true
#
# concurrent: 1        # Number of parallel reconciles. The throughput ceiling once ExternalSecrets grow
# replicaCount: 1      # For redundancy, set it together with leaderElect: true
# leaderElect: false
#
# webhook:
#   certManager:
#     enabled: false   # Switch to delegate certificate management to cert-manager (cert-controller does it by default)
#
# resources: {}        # Unset by default for every component. Must be set in production
