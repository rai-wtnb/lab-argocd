# RBAC on the destination cluster (spoke).
# Argo CD on the hub connects with the token of a ServiceAccount (argocd-manager) in this cluster.
# Note: in production, cloud IAM integration (on GKE, Connect Gateway + Workload Identity) removes the token.

# scripts/04-spokes.sh applies this whole file to each spoke.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
# Long-lived token (lab only). An object that is not needed with IAM integration.
# 04-spokes.sh extracts this token and puts it into the cluster Secret on the hub
# (config.bearerToken in hub/clusters.yaml), where Argo CD on the hub uses it to authenticate to this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
---
# Read access (all resources) for the cluster cache / diffing + Namespace write for CreateNamespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-manager
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-manager
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
---
# Namespaced write for the apps. Simplified with a wildcard in the lab.
# In production, list the resource kinds that get deployed (the kustomize build output) for least privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-app-writer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-app-writer
  namespace: demo-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-app-writer
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
