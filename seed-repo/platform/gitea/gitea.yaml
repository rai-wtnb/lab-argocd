# GitOps のソースになる Git リポジトリを提供する Gitea。hub クラスタ内で完結させる。
# - ArgoCD からはクラスタ内 DNS: http://gitea.gitea.svc.cluster.local:3000
# - 手元からは NodePort 経由:   http://localhost:3000 (kind/hub.yaml の extraPortMappings)
#
# 鶏と卵に注意: Gitea 自身のマニフェストを Gitea 上のリポジトリで管理している。
# 初回だけ scripts/03-gitea.sh がこのファイルを直接 apply し (ブートストラップ)、
# 以後は手書き Application `gitea` (hub/platform.yaml) がこれを adopt して管理する。
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  strategy:
    type: Recreate # PVC (RWO) を持つため
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.23-rootless
          env:
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__ROOT_URL
              value: http://localhost:3000/
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: config
          emptyDir: {} # app.ini は起動時に env から再生成される
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
