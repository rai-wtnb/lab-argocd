# 外部シークレットストアとして使う Vault (dev モード)。hub クラスタに置き、
# spoke の ESO からは NodePort 経由 http://demo-hub-control-plane:30201 で見える
# (= アプリのクラスタから見て「外部のシークレットストア」)。
# dev モードはインメモリ・root token 固定なので完全にデモ専用。
#
# Gitea と違いブートストラップ不要 — 手書き Application `vault` (hub/platform.yaml) の
# sync が最初からこのファイルを配る (純粋な GitOps 管理)。
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  type: NodePort
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30201
