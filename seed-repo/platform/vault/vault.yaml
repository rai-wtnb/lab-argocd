# Vault (dev mode), used as the external secret store. It sits in the hub cluster, and ESO on
# the spoke reaches it through the NodePort at http://demo-hub-control-plane:30201
# (= an "external secret store" from the app cluster's point of view).
# dev mode is in-memory with a fixed root token, so it is strictly for demos.
#
# Unlike Gitea, no bootstrap is needed. The sync of the hand-written Application `vault`
# (hub/platform.yaml) ships this file from the start (pure GitOps management).
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  type: NodePort
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30201
