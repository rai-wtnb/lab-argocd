# Connection definition for the external secret store (Vault).
# Auth uses the vault-token Secret (created by scripts/06-eso.sh. Not needed with cloud IAM integration).
# REF: https://external-secrets.io/latest/api/secretstore
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://demo-hub-control-plane:30201
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
