# 外部シークレットストア (Vault) への接続定義。
# 認証は vault-token Secret (scripts/06-eso.sh が作る。クラウドの IAM 連携なら不要な部品)。
# REF: https://external-secrets.io/latest/api/secretstore
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://demo-hub-control-plane:30201
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
