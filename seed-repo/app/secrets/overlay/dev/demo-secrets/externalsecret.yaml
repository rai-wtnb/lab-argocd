# The pattern where git holds only the ExternalSecret (the declaration of what to fetch from where)
# and the value lives in an external store.
# ESO fetches the value from secret/demo-app in Vault and keeps generating / updating
# the K8s Secret demo-app-secret (every refreshInterval).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: demo-app-secret
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: demo-app
        property: message
