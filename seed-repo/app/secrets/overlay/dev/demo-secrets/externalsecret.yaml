# 「git には ExternalSecret (何をどこから取るかの宣言) だけを置き、値は外部ストアに置く」パターン。
# ESO が Vault の secret/demo-app から値を取り、
# K8s Secret demo-app-secret を生成・更新し続ける (refreshInterval ごと)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: demo-app-secret
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: demo-app
        property: message
