apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  # NodePort 30898 is published to the host through kind's extraPortMappings
  # (dev → localhost:9898 / stg → localhost:9899)
  type: NodePort
  selector:
    app: demo-app
  ports:
    - port: 9898
      targetPort: 9898
      nodePort: 30898
