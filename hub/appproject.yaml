# The team's project.
# The allowlist of which cluster x namespace the Applications of this project may sync to.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  description: "demo team applications (dev/stg)"
  sourceRepos:
    - http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
  destinations:
    - name: spoke-dev
      namespace: demo-app
    - name: spoke-stg
      namespace: demo-app
  clusterResourceWhitelist:
    # Allow only Namespace as cluster-scoped, for CreateNamespace=true
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
