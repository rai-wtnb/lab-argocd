# Template of a registry entry for Argo CD's declarative cluster registration
# (argocd.argoproj.io/secret-type: cluster).
# For the two clusters spoke-dev / spoke-stg, scripts/04-spokes.sh fills in
# __ENV__ / __SERVER__ / __CONFIG__ and applies it (1 spoke = 1 of this Secret).
#
# Why it is committed with placeholders:
#   - server: kind's internal endpoint is decided each time the cluster is created (dynamic)
#   - config: bearerToken is a real secret and cannot live in Git
# With cloud IAM integration (execProviderConfig) the secret disappears and the values can be committed too.
#
# Example of the values actually filled in (for dev):
#   name:   spoke-dev
#   server: https://demo-dev-control-plane:6443    # container name of the kind node + API server port
#   config: '{"bearerToken":"eyJhbGciOiJSUzI1NiIs…(JWT of argocd-manager)…",
#             "tlsClientConfig":{"insecure":false,"caData":"LS0tLS1CRUdJTi…(base64 of the cluster CA certificate)…"}}'
#   (the real one after applying: kubectl --context kind-demo-hub -n argocd get secret cluster-spoke-dev -o yaml)
apiVersion: v1
kind: Secret
metadata:
  name: cluster-spoke-__ENV__
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster # this label marks a row of the cluster registry
type: Opaque
stringData:
  # Logical name. Referenced by destinations of an AppProject and destination.name of an Application
  name: spoke-__ENV__
  # URL of the destination K8s API server (with kind, the container name on the shared docker network)
  server: __SERVER__
  # Auth settings (JSON). The lab uses a ServiceAccount bearer token + the cluster CA
  config: '__CONFIG__'
