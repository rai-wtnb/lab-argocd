# Argo CD itself. The argo-cd chart is rendered with kustomize's helmCharts feature
# (rendering needs the helm CLI. scripts/02-argocd.sh applies it with server-side apply).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

# Does the equivalent of helm repo add argo https://argoproj.github.io/argo-helm when rendering.
# The chart version is pinned.
helmCharts:
  - name: argo-cd
    releaseName: argocd
    repo: https://argoproj.github.io/argo-helm
    version: 10.18.0
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true # the CRDs get registered in kube-apiserver as types = they become appliable
