# Minimal values for the lab. Only the differences from the chart defaults are written (helm deep-merges).
# Each line also notes the default of the chart (10.18.0 / Argo CD v3.6.1). `mise argocd-chart-values` shows all the defaults (about 5,000 lines).
# REF: https://artifacthub.io/packages/helm/argo/argo-cd?modal=values
# Since chart 10.0.0 the default of global.networkPolicy.create is true, and each component gets a NetworkPolicy.
# They only restrict ingress, and argocd-server allows every source, so the UI through the NodePort works as before.
# This lab keeps the default (to disable: global.networkPolicy.create: false).
dex:
  enabled: false # default: true. No SSO integration (admin and a local account are enough)
notifications:
  enabled: false # default: true. No notification integration

server:
  service:
    # default: ClusterIP. NodePort 30443 is published on host port 8080 through kind's extraPortMappings
    # (https://localhost:8080 with no port-forward)
    type: NodePort
    nodePortHttps: 30443 # same as the default. Written to make the link to containerPort in kind/hub.yaml explicit

configs:
  cm:
    # default: 120s. Git polling is shortened so the lab feels responsive (production usually wires a webhook for immediate updates)
    timeout.reconciliation: 20s
    # default: no local accounts (admin only). Added for the RBAC demo (in production the norm is SSO with teams as subjects).
    # scripts/02-argocd.sh sets the password (demo12345)
    accounts.demo-dev: login
  params:
    # default: unset (the default of applicationset-controller itself is 3m). Shortens how often generators are re-evaluated
    # (wired into env through cmd-params-cm)
    applicationsetcontroller.requeue.after: 30s
  rbac:
    # default: empty. Argo CD's in-app RBAC (Casbin format). admin is a superuser that bypasses RBAC.
    # policy.default also stays at its empty default = deny by default, so demo-dev can only do what is allowed below.
    policy.csv: |
      # role:team-demo can only view, sync and read the logs of Applications under project demo
      # (delete / override are not allowed -> trying them in the UI is denied)
      p, role:team-demo, applications, get,  demo/*, allow
      p, role:team-demo, applications, sync, demo/*, allow
      p, role:team-demo, logs,         get,  demo/*, allow
      p, role:team-demo, projects,     get,  demo,   allow
      g, demo-dev, role:team-demo
