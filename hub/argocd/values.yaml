# ラボ用の最小構成 values。
# 非HA (チャートのデフォルト)。SSO は使わず、admin + ローカルアカウント (demo-dev) でログインする。
# REF: https://artifacthub.io/packages/helm/argo/argo-cd?modal=values
dex:
  enabled: false # SSO 連携なし (admin とローカルアカウントで足りる)
notifications:
  enabled: false # 通知連携なし

server:
  service:
    # NodePort 30443 を kind の extraPortMappings でホストの 8080 に公開する
    # (port-forward 不要で https://localhost:8080)
    type: NodePort
    nodePortHttps: 30443

configs:
  cm:
    # ラボ体感のため Git ポーリングを短縮 (本番は webhook を配線して即時反映が一般的)
    timeout.reconciliation: 20s
    # RBAC デモ用のローカルアカウント (本番は SSO 連携でチームを subject にするのが定石)。
    # パスワードは scripts/02-argocd.sh が設定する (demo12345)
    accounts.demo-dev: login
  params:
    # ApplicationSet generator の再評価間隔も短縮 (cmd-params-cm 経由で env に配線される)
    applicationsetcontroller.requeue.after: 30s
  rbac:
    # ArgoCD アプリ内 RBAC (Casbin 形式)。admin は RBAC を素通しする superuser。
    # policy.default はチャート既定の空 = 既定拒否なので、demo-dev は下記の許可分しか操作できない。
    policy.csv: |
      # role:team-demo は project demo 配下の Application を見る・sync する・ログを読むことだけできる
      # (delete / override は許可していない → UI で試すと拒否される)
      p, role:team-demo, applications, get,  demo/*, allow
      p, role:team-demo, applications, sync, demo/*, allow
      p, role:team-demo, logs,         get,  demo/*, allow
      p, role:team-demo, projects,     get,  demo,   allow
      g, demo-dev, role:team-demo
