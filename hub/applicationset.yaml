# Opt-in mass production of Applications with the git files generator.
# When app.argocd.yaml (a marker) is placed in the repository on Gitea,
# the generator reads it and generates one Application.
# An app with no marker is not generated (opt-in).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: managed-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
        revision: HEAD
        files:
          - path: "app/*/overlay/dev/*/app.argocd.yaml"
          # The same hub manages stg too (note that Application names must be unique within the hub)
          - path: "app/*/overlay/stg/*/app.argocd.yaml"
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        team: '{{ .team }}'
      annotations:
        # monorepo optimization: refresh only when the overlay of this app changes
        argocd.argoproj.io/manifest-generate-paths: '.'
    spec:
      project: '{{ .project }}'
      source:
        repoURL: http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        # Resolve the destination cluster from env in the marker (destinationCluster overrides it)
        name: '{{ dig "destinationCluster" (printf "spoke-%s" .env) . }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true    # delete resources removed from git
          selfHeal: true # revert manual changes to the live state
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
