# The platform project, which puts the platform components (Gitea / Vault) under Argo CD's own management.
# A worked example of writing the Application CRD by hand, the counterpart of the demo side that an
# ApplicationSet mass-produces.
# - The destination is in-cluster (= the hub itself, where Argo CD runs. A built-in, pre-registered logical name)
# - Gitea is chicken-and-egg (the Git server's own manifest is managed in that Git), so the first time only
#   scripts/03-gitea.sh applies the same file directly, and then this Application adopts it
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: "platform components on hub (gitea / vault)"
  sourceRepos:
    - http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
  destinations:
    - name: in-cluster
      namespace: gitea
    - name: in-cluster
      namespace: vault
  clusterResourceWhitelist:
    # The manifests include a Namespace, so cluster scope is allowed
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
    targetRevision: HEAD
    path: platform/gitea
  destination:
    name: in-cluster
    namespace: gitea
  syncPolicy:
    automated:
      selfHeal: true
      # No prune: if platform/gitea is removed from the repo by mistake, this keeps the Git server,
      # which is the source of GitOps itself, from being deleted (protects critical infrastructure)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/demo/manifests.git
    targetRevision: HEAD
    path: platform/vault
  destination:
    name: in-cluster
    namespace: vault
  syncPolicy:
    automated:
      selfHeal: true
      prune: true # dev mode and disposable, so fully automatic is fine
