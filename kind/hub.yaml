# The hub cluster. Publishes NodePorts to the host:
# - Gitea (30300 -> localhost:3000). For git push from the host. Argo CD reaches the same Gitea through in-cluster DNS
# - Argo CD UI (30443 -> localhost:8080). Always reachable, with no port-forward
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30443
        hostPort: 8080
        protocol: TCP
