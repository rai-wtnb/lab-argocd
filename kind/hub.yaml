# hub クラスタ。NodePort をホストへ公開する:
# - Gitea (30300 → localhost:3000)。手元の git push 用。ArgoCD はクラスタ内 DNS 経由で同じ Gitea を見る
# - ArgoCD UI (30443 → localhost:8080)。port-forward なしで常時アクセスできるようにする
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30443
        hostPort: 8080
        protocol: TCP
