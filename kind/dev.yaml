# The spoke-dev cluster. Publishes the NodePort (30898) of demo-app (podinfo) on host port 9898
# (once the marker is synced, the UI is at http://localhost:9898).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30898
        hostPort: 9898
        protocol: TCP
